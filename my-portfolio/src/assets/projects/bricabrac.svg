<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Bric-a-Brac application de cotisation illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#065F46" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <circle cx="150" cy="130" r="90" fill="#BBF7D0" opacity="0.7"/>
  <circle cx="1080" cy="120" r="60" fill="#A7F3D0" opacity="0.7"/>
  <circle cx="1090" cy="700" r="130" fill="#BBF7D0" opacity="0.45"/>

  <g filter="url(#shadow)">
    <rect x="140" y="180" width="520" height="500" rx="30" fill="url(#panel)"/>
  </g>

  <text x="185" y="255" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1E293B">Cotisations association</text>
  <text x="185" y="292" font-family="Arial, sans-serif" font-size="21" fill="#64748B">Mensuelles &amp; spéciales · 8 membres</text>

  <text x="185" y="390" font-family="Arial, sans-serif" font-size="58" font-weight="700" fill="#059669">1 250 000</text>
  <text x="185" y="425" font-family="Arial, sans-serif" font-size="24" fill="#10B981">FCFA collectés</text>

  <rect x="185" y="460" width="430" height="24" rx="12" fill="#E2E8F0"/>
  <rect x="185" y="460" width="312" height="24" rx="12" fill="url(#green)"/>
  <text x="185" y="520" font-family="Arial, sans-serif" font-size="19" fill="#64748B">Objectif : 1 700 000 FCFA (73%)</text>

  <g>
    <rect x="185" y="560" width="120" height="80" rx="16" fill="#ECFDF5"/>
    <text x="245" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#047857">8</text>
    <text x="245" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#10B981">Membres</text>

    <rect x="330" y="560" width="120" height="80" rx="16" fill="#EFF6FF"/>
    <text x="390" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1D4ED8">6/8</text>
    <text x="390" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#3B82F6">Payés</text>

    <rect x="475" y="560" width="140" height="80" rx="16" fill="#FEF3C7"/>
    <text x="545" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#B45309">Spéciale</text>
    <text x="545" y="622" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#D97706">Cotisation</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="720" y="230" width="360" height="450" rx="30" fill="#FFFFFF"/>
  </g>
  <text x="760" y="295" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1E293B">Membres</text>

  <g>
    <circle cx="790" cy="350" r="26" fill="#34D399"/>
    <text x="790" y="358" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">A</text>
    <rect x="835" y="336" width="150" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="835" y="360" width="90" height="10" rx="5" fill="#CBD5E1"/>
    <path d="M1080 344 l8 8 l16 -16" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="790" cy="425" r="26" fill="#60A5FA"/>
    <text x="790" y="433" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">B</text>
    <rect x="835" y="411" width="140" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="835" y="435" width="100" height="10" rx="5" fill="#CBD5E1"/>
    <path d="M1080 419 l8 8 l16 -16" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="790" cy="500" r="26" fill="#A78BFA"/>
    <text x="790" y="508" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">C</text>
    <rect x="835" y="486" width="160" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="835" y="510" width="80" height="10" rx="5" fill="#CBD5E1"/>
    <path d="M1080 494 l8 8 l16 -16" fill="none" stroke="#10B981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="790" cy="575" r="26" fill="#FBBF24"/>
    <text x="790" y="583" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF">D</text>
    <rect x="835" y="561" width="130" height="12" rx="6" fill="#E2E8F0"/>
    <rect x="835" y="585" width="95" height="10" rx="5" fill="#CBD5E1"/>
    <circle cx="1088" cy="573" r="9" fill="#F59E0B"/>
  </g>

  <g transform="translate(300 620)" filter="url(#shadow)">
    <ellipse cx="70" cy="60" rx="70" ry="22" fill="#F59E0B"/>
    <path d="M0 60 v22 a70 22 0 0 0 140 0 v-22" fill="url(#coin)"/>
    <path d="M0 38 v22 a70 22 0 0 0 140 0 v-22" fill="url(#coin)"/>
    <ellipse cx="70" cy="38" rx="70" ry="22" fill="#FDE68A"/>
    <text x="70" y="46" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#B45309">F</text>
  </g>

  <g transform="translate(160 640)">
    <circle cx="30" cy="30" r="30" fill="url(#green)"/>
    <path d="M18 30 l8 8 l16 -16" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
