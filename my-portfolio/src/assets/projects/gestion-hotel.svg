  <g transform="translate(870 210)" filter="url(#shadow)">
    <rect x="0" y="0" width="140" height="90" rx="14" fill="url(#sky)"/>
    <circle cx="40" cy="45" r="20" fill="#FDE68A"/>
    <rect x="78" y="30" width="44" height="10" rx="5" fill="#E0E7FF"/>
    <rect x="78" y="50" width="30" height="10" rx="5" fill="#C7D2FE"/>
  </g>

  <g transform="translate(200 620)">
