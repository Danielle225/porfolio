    <rect x="745" y="535" width="34" height="80" rx="6" fill="#4F46E5"/>
    <rect x="790" y="558" width="34" height="57" rx="6" fill="#818CF8"/>
    <rect x="835" y="545" width="34" height="70" rx="6" fill="#6366F1"/>
    <rect x="880" y="525" width="34" height="90" rx="6" fill="#4F46E5"/>
    <rect x="925" y="565" width="34" height="50" rx="6" fill="#818CF8"/>
