  </g>

  <rect x="580" y="215" width="200" height="20" rx="10" fill="#E2E8F0"/>
  <rect x="580" y="215" width="120" height="20" rx="10" fill="#6366F1"/>

  <text x="580" y="300" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#1E293B">Gestion Résidence</text>
  <text x="580" y="340" font-family="Arial, sans-serif" font-size="22" fill="#64748B">Back-office de gestion</text>

  <g>
