    <text x="610" y="430" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#4338CA">128</text>
    <text x="610" y="465" font-family="Arial, sans-serif" font-size="18" fill="#6366F1">Chambres</text>

    <rect x="810" y="380" width="210" height="120" rx="18" fill="#ECFDF5"/>
    <text x="840" y="430" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#047857">76%</text>
    <text x="840" y="465" font-family="Arial, sans-serif" font-size="18" fill="#10B981">Occupation</text>
  </g>

