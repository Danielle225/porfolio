<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Gestion Hotel illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EEF2FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#312E81" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <circle cx="160" cy="130" r="80" fill="#C7D2FE" opacity="0.6"/>
  <circle cx="1080" cy="120" r="55" fill="#BFDBFE" opacity="0.7"/>
  <circle cx="1090" cy="700" r="120" fill="#C7D2FE" opacity="0.4"/>

  <g filter="url(#shadow)">
    <rect x="140" y="230" width="360" height="430" rx="26" fill="url(#tower)"/>
  </g>
  <g fill="#C7D2FE">
    <rect x="185" y="280" width="55" height="55" rx="8"/>
    <rect x="270" y="280" width="55" height="55" rx="8"/>
    <rect x="355" y="280" width="55" height="55" rx="8"/>
    <rect x="440" y="280" width="25" height="55" rx="8"/>
    <rect x="185" y="370" width="55" height="55" rx="8"/>
    <rect x="270" y="370" width="55" height="55" rx="8"/>
    <rect x="355" y="370" width="55" height="55" rx="8"/>
    <rect x="440" y="370" width="25" height="55" rx="8"/>
    <rect x="185" y="460" width="55" height="55" rx="8"/>
    <rect x="270" y="460" width="55" height="55" rx="8"/>
    <rect x="355" y="460" width="55" height="55" rx="8"/>
    <rect x="440" y="460" width="25" height="55" rx="8"/>
    <rect x="185" y="550" width="55" height="55" rx="8"/>
    <rect x="270" y="550" width="55" height="55" rx="8"/>
    <rect x="355" y="550" width="55" height="55" rx="8"/>
    <rect x="440" y="550" width="25" height="55" rx="8"/>
  </g>

  <g filter="url(#shadow)">
